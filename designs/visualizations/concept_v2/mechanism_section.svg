<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540"><rect width="1100" height="540" fill="white"/><g font-family="sans-serif"><text x="20" y="28" font-size="21">CONCEPT: tapered film cartridge / three-zone vacuum jacket</text><rect x="35" y="65" width="240" height="130" rx="10" fill="#b4dfe5" stroke="#333"/><text x="47" y="95">zone 1: 0-30 mm</text><path d="M55,65 V45 H1015 V250" fill="none" stroke="#555"/><text x="900" y="265">circuit 1</text><rect x="315" y="65" width="240" height="130" rx="10" fill="#e6d3aa" stroke="#333"/><text x="327" y="95">zone 2: 35-65 mm</text><path d="M335,65 V45 H1015 V290" fill="none" stroke="#555"/><text x="900" y="305">circuit 2</text><rect x="595" y="65" width="240" height="130" rx="10" fill="#cec9e8" stroke="#333"/><text x="607" y="95">zone 3: 70-100 mm</text><path d="M615,65 V45 H1015 V330" fill="none" stroke="#555"/><text x="900" y="345">circuit 3</text><path d="M20,115 H850 M20,160 H850" stroke="#c74b31" stroke-width="3"/><text x="35" y="220">Two edge tendons; equalizer drive. Three circuits shared across fingers.</text><text x="35" y="248">5 mm unjammed hinge/seal bridges. Continuous object-facing skin.</text><rect x="40" y="290" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="298" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="306" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="314" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="322" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="330" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="338" width="330" height="5" fill="#69a4ad" stroke="#333"/><rect x="40" y="346" width="330" height="5" fill="#69a4ad" stroke="#333"/><text x="390" y="310">Section: 8 x assumed 0.05 mm film + sleeve</text><text x="390" y="340">Pressure port / sealed pouch / sliding distal layer ends</text><text x="390" y="370">Root clamp transfers load; seals must not bond all layers together</text><text x="35" y="410">Sequence: approach - tendon adapt - selected zones jam - hold - vent - release</text><text x="35" y="445">Jamming OFF/ON shapes here are NOT SOFA results. No proven holding-force gain.</text><text x="35" y="480">Changeable root cartridge; elastic sleeve/return strip. Sealing and hose routing unresolved.</text></g></svg>